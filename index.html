    <!-- Motion mode before first paint (avoids a layout flash). Kept in sync on change. -->
    <script>
      (function () {
        var d = document.documentElement
        var m = window.matchMedia('(prefers-reduced-motion: reduce)')
        function set() { d.setAttribute('data-motion', m.matches ? 'reduced' : 'full') }
        set()
        if (m.addEventListener) m.addEventListener('change', set)
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      })()
    </script>
